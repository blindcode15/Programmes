name: iOS Build (XcodeGen)
# ci: retrigger demo video

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build MoodDiary (iOS 17)
    runs-on: macos-14
    steps:
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.*'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators and runtimes
        run: |
          xcrun simctl list devices available
          echo '---'
          xcrun simctl list runtimes

      - name: Build for iOS Simulator (capture full log)
        run: |
          set +e
          set -o pipefail
          export NSUnbufferedIO=YES
          xcodebuild \
            -project MoodDiary.xcodeproj \
            -scheme MoodDiary \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-sim.log
          CODE=${PIPESTATUS[0]}
          echo "xcodebuild exit code: $CODE"
          exit $CODE
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-sim-log
          path: build-sim.log
      - name: Show last compiler errors (summary)
        if: failure()
        run: |
          echo '--- Tail last 300 lines ---'
          tail -n 300 build-sim.log || true
          echo '--- Grep error/warning lines ---'
          grep -E "(error:|warning:)" -n build-sim.log || true
      - name: Record simulator video (ensure app is visible)
        if: always()
        run: |
          set +e
          set -o pipefail
          # Use .mov for best compatibility with simctl; we'll upload with wildcard
          VIDEO="$GITHUB_WORKSPACE/app-demo.mov"
          echo "VIDEO target: $VIDEO"
          # Determine simulator build output path
          SETTINGS=$(xcodebuild -project MoodDiary.xcodeproj -scheme MoodDiary -sdk iphonesimulator -configuration Debug -showBuildSettings)
          TARGET_BUILD_DIR=$(echo "$SETTINGS" | awk -F" = " '/TARGET_BUILD_DIR/ {print $2; exit}')
          APP_PATH="$TARGET_BUILD_DIR/MoodDiary.app"
          echo "APP_PATH=$APP_PATH"
          # Try to reuse a booted device first
          BOOTED=$(xcrun simctl list devices | awk -F '[()]' '/Booted/ {print $2; exit}')
          if [ -n "$BOOTED" ]; then
            DEVICE="$BOOTED"
            echo "Using already booted DEVICE=$DEVICE"
          else
            # Prefer iPhone 16 (iOS 18), then iPhone 15 (iOS 17), otherwise any available iPhone
            DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16/ {print $2; exit}')
            if [ -z "$DEVICE" ]; then
              DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 15/ {print $2; exit}')
            fi
            if [ -z "$DEVICE" ]; then
              DEVICE=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
            fi
            if [ -z "$DEVICE" ]; then
              echo "No available iPhone simulators found; creating one"
              RUNTIME=$(xcrun simctl list runtimes | awk -F '[()]' '/iOS/ && /Available/ {print $2; exit}')
              DEVICE=$(xcrun simctl create 'CI iPhone' 'iPhone 15' "$RUNTIME")
            fi
            echo "Using DEVICE=$DEVICE"
            # Boot and wait
            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b || true
          fi
          TARGET=booted
          # Install app (best-effort)
          if [ -d "$APP_PATH" ]; then
            xcrun simctl install "$DEVICE" "$APP_PATH" || true
          else
            echo "App not found at $APP_PATH (build may have failed). Will record home screen."
          fi
          # Launch first to avoid capturing SpringBoard; give it a moment to settle
          echo "Launching app with DEMO_MODE..."
          xcrun simctl launch "$DEVICE" com.yourcompany.mood --args DEMO_MODE || true
          sleep 2
          # Start recording (force overwrite)
          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --force "$VIDEO" &
          REC_PID=$!
          SECONDS=26
          echo "Recording for $SECONDS seconds..."
          sleep $SECONDS
          kill $REC_PID 2>/dev/null || true
          wait $REC_PID 2>/dev/null || true
          echo 'Recorded file:'
          ls -l "$VIDEO" || true
          # Fallback: take a screenshot if video missing
          if [ ! -f "$VIDEO" ]; then
            echo 'Video not found, taking a screenshot instead'
            xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/app-screenshot.png" || true
          fi
      - name: Upload simulator video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-video
          path: app-demo.*
      - name: Run UI snapshot tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project MoodDiary.xcodeproj \
            -scheme MoodDiary \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -only-testing:MoodDiaryScreenshots \
            test \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-output.log \
            | xcpretty -c || true
      - name: Collect xcresult bundles
        if: always()
        run: |
          mkdir -p xcresults
          # Copy any recent .xcresult bundles (build or test) for debugging
          find ~/Library/Developer/Xcode/DerivedData -type d -name "*.xcresult" -print -exec cp -R {} xcresults/ \; 2>/dev/null || true
          ls -la xcresults || true
      - name: Upload xcresult bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: xcresults
    - name: Export xcresult summaries (JSON + HTML)
    if: always()
    run: |
      set -e
      mkdir -p xcresults-summary
      FOUND=0
      while IFS= read -r -d '' BUNDLE; do
      FOUND=1
      NAME=$(basename "$BUNDLE")
      JSON="xcresults-summary/${NAME}.json"
      HTML="xcresults-summary/${NAME}.html"
      xcrun xcresulttool get --format json --path "$BUNDLE" > "$JSON" || true
      JSON="$JSON" HTML="$HTML" python3 - << 'PY'
import json, os
jpath = os.environ.get('JSON')
hpath = os.environ.get('HTML')
try:
  data = json.load(open(jpath,'r'))
except Exception as e:
  open(hpath,'w',encoding='utf-8').write('<!doctype html><meta charset="utf-8"><body style="font-family:system-ui;">No data: %s</body>'%e)
  raise SystemExit(0)

def collect_tests(obj, acc):
  if isinstance(obj, dict):
    name = obj.get('name')
    status = obj.get('testStatus') or obj.get('status')
    if name and status:
      acc.append((name, str(status)))
    for v in obj.values():
      collect_tests(v, acc)
  elif isinstance(obj, list):
    for v in obj:
      collect_tests(v, acc)

tests=[]
collect_tests(data, tests)
passed = sum(1 for _,s in tests if s.lower()=='success')
failed = sum(1 for _,s in tests if s.lower() in ('failure','fail','failed','error'))
total = len(tests)
html = []
html.append('<!doctype html><meta charset="utf-8"><title>xcresult summary</title>')
html.append('<style>body{font-family:system-ui,Segoe UI,Arial;margin:20px;color:#e8f0ff;background:#0b0f14} .muted{color:#93a0b6} table{border-collapse:collapse;width:100%} td,th{border:1px solid #223046;padding:6px 8px} th{background:#121822} .ok{color:#63d483} .bad{color:#ff7a7a}</style>')
html.append(f'<h1 style="margin:0 0 8px">xcresult: {os.path.basename(jpath)}</h1>')
html.append(f'<div class="muted">Total: {total} • <span class="ok">Passed: {passed}</span> • <span class="bad">Failed: {failed}</span></div>')
html.append('<table><tr><th>Test</th><th>Status</th></tr>')
for name, status in tests:
  css = 'ok' if status.lower()=='success' else ('bad' if status.lower() in ('failure','fail','failed','error') else 'muted')
  html.append(f'<tr><td>{name}</td><td class="{css}">{status}</td></tr>')
html.append('</table>')
open(hpath,'w',encoding='utf-8').write('\n'.join(html))
PY
      done < <(find xcresults -type d -name "*.xcresult" -print0 2>/dev/null || true)
      # Create an index page
      python3 - << 'PY'
import os, glob
items = sorted(glob.glob('xcresults-summary/*.html'))
out = ['<!doctype html><meta charset="utf-8"><title>xcresults index</title><style>body{font-family:system-ui,Segoe UI,Arial;margin:20px;color:#e8f0ff;background:#0b0f14} a{color:#7cc8ff;text-decoration:none} a:hover{text-decoration:underline} .muted{color:#93a0b6}</style><h1>xcresults</h1>']
if not items:
  out.append('<p class="muted">No summaries generated.</p>')
else:
  out.append('<ul>')
  for f in items:
    base=os.path.basename(f)
    out.append(f'<li><a href="{base}">{base}</a></li>')
  out.append('</ul>')
open('xcresults-summary/index.html','w',encoding='utf-8').write('\n'.join(out))
PY
    - name: Upload xcresult summaries
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: xcresults-summary
      path: xcresults-summary
      - name: Collect snapshots (from log)
        run: |
          mkdir -p snapshots
          # First, parse xcodebuild raw output for absolute file paths printed by tests
          if [ -f test-output.log ]; then
            awk '/SNAPSHOT:/ {print substr($0, index($0,$2))}' test-output.log | while read -r p; do
              if [ -f "$p" ]; then
                cp -v "$p" snapshots/ || true
              fi
            done
          fi
          # Fallback: scan typical temp roots for our MD_*.png with deeper search
          find /private/var/folders -type f -name 'MD_*.png' -maxdepth 12 -print -exec cp -v {} snapshots/ \; 2>/dev/null || true
          ls -la snapshots || true
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: snapshots
